services:
  postgres:
    image: postgres:16-alpine
    container_name: haveqr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haveqr}
      POSTGRES_USER: ${POSTGRES_USER:-haveqr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haveqr_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haveqr} -d ${POSTGRES_DB:-haveqr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: haveqr-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: haveqr-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-haveqr}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-haveqr_dev_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data: